[workspace]
members = [
    "crates/desert-tiger-core",
    "crates/desert-tiger-app",
    "crates/desert-tiger-terminal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
fundsp = { version = "=0.23.0", default-features = false, features = ["std"] }
cpal = { version = "=0.18.2", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
unicode-width = "=0.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ron = { version = "=0.12.2", features = ["integer128"] }
flate2 = "=1.1.10"
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored"] }
rand = "=0.10.3"
rand_chacha = "=0.10.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

