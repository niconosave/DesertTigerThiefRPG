[package]
name = "desert-tiger-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["audio"]
audio = ["dep:fundsp", "dep:cpal"]

[dependencies]
fundsp = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
crossterm.workspace = true
desert-tiger-app = { path = "../desert-tiger-app" }
flate2.workspace = true
ratatui.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true

[[bin]]
name = "desert-tiger-terminal"
path = "src/main.rs"

[[bin]]
name = "importar-retrato-durdraw"
path = "src/bin/importar_retrato_durdraw.rs"

[[example]]
name = "previsualizar_melodia"
path = "examples/previsualizar_melodia.rs"
required-features = ["audio"]

